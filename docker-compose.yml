services:
  app:
    build:
      context: .
      args:
        - NODE_VERSION=22
    image: juli30:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_PATH=/data/db.sqlite
      - UPLOADS_PATH=/data/uploads
    volumes:
      - juli30_data:/data
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  juli30_data:
